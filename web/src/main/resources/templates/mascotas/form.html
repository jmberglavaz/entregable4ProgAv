<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registrar Nueva Mascota</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <div class="card shadow-sm mx-auto" style="max-width: 600px;">
        <div class="card-header bg-primary text-white">
            <h3 class="mb-0">Registrar Nueva Mascota</h3>
        </div>
        <div class="card-body">
            <form th:action="@{/mascotas}" method="post">
                <div class="mb-3">
                    <label class="form-label">Nombre:</label>
                    <input type="text" name="nombre" class="form-control" required>
                </div>
                <div class="row mb-3">
                    <div class="col">
                        <label class="form-label">Especie:</label>
                        <select name="especie" class="form-select" required>
                            <option value="" disabled selected>Seleccione...</option>
                            <option th:each="e : ${especies}" th:value="${e}" th:text="${e}"></option>
                        </select>
                    </div>
                    <div class="col">
                        <label class="form-label">Género:</label>
                        <select name="genero" class="form-select" required>
                            <option value="" disabled selected>Seleccione...</option>
                            <option th:each="g : ${generos}" th:value="${g}" th:text="${g}"></option>
                        </select>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Edad (años):</label>
                    <input type="number" name="edad" class="form-control" min="0" max="30">
                </div>
                <div class="mb-3">
                    <label class="form-label">URL de la Foto (opcional):</label>
                    <input type="url" name="fotoUrl" class="form-control" placeholder="https://...">
                </div>
                <div class="mb-3">
                    <label class="form-label">Descripción:</label>
                    <textarea name="descripcion" class="form-control" rows="3"></textarea>
                </div>
                <div class="d-flex justify-content-between">
                    <a th:href="@{/mascotas}" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-success">Guardar Mascota</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
