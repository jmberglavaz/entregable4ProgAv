version: '3.8'

services:
  jenkins:
    build: .
    container_name: jenkins-mascotas
    ports:
      - "8080:8080"   # Interfaz web de Jenkins
      - "50000:50000" # Puerto para agentes (no lo usamos, pero es estándar)
    volumes:
      - jenkins_home:/var/jenkins_home
    restart: unless-stopped

volumes:
  jenkins_home: